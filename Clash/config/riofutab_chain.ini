[custom]
;不要随意改变关键字，否则会导致出错
;节点固定为五个：GIA-REALITY / GIA-ANYTLS / GIA-HOME / HK-REALITY / HK-ANYTLS
;
;★[硬约束3.1] GIA-HOME 只进 select 组，绝不进任何 url-test/fallback/load-balance。
;  ♻️ 自动选择 是全配置唯一的 url-test，用逐个锚定的白名单正则(^…$)，
;  GIA-HOME 结构上不可能被它捞进去 —— 「绝不被自动选中」这条仍然成立。
;  2026-09-11 按用户指示改为直接引用节点，不再经「🏠 家宽落地」组中转：
;    下列八组以 GIA-HOME 打头(默认即走住宅 IP)：OpenAi / TikTok / DisneyPlus /
;    银行代理 / 国际支付 / Twitter / Meta社交 / Reddit
;    其余组把 GIA-HOME 列为可选项但不置首，默认仍走机房出口。
;  订阅生成必须带 emoji=false：一旦 subconverter 给节点名加 emoji 前缀，
;  ^GIA-REALITY$ 这类白名单会全部失配，自动选择变空组。
;
;规则集段以 ACL4SSR_Online_Full.ini 的 97 条为基础，只增不删，扩容到 275 条。
;新增来源：blackmatrix7/ios_rule_script、SukkaW/Surge(ruleset.skk.moe)、
;         Loyalsoldier/clash-rules、Aethersailor/Custom_OpenClash_Rules。
;
;★ 按体积剔除的 9 条（不是因为无用，是因为内联进订阅会把配置撑到 20MB+）：
;  已被现有规则覆盖，剔除无损失（实测覆盖率）：
;    blackmatrix7 ChinaMax  42574 域名 → []GEOSITE,cn 覆盖 99.3%
;    Loyalsoldier direct    111112 域名 → []GEOSITE,cn 覆盖 98.2%
;    blackmatrix7 ChinaIPs / Loyalsoldier cncidr → []GEOIP,CN 覆盖
;    blackmatrix7 Global    34926 域名 → []GEOSITE,geolocation-!cn 覆盖 74.2%，
;      剩下的 9006 条落到 []FINAL(漏网之鱼→节点选择)，行为不变
;    Loyalsoldier proxy → ProxyGFWlist + Loyalsoldier gfw 覆盖
;  ★纯粹因为太大而剔除，功能上是真损失，需要时取消注释即可：
;    ruleset=🛑 广告拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.list
;      280017 域名 / 9.0MB。已保留其精选子集 AdvertisingLite(37879 条，94% 落在 Advertising 内)
;    ruleset=🍃 应用净化,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy.list
;    ruleset=🍃 应用净化,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/EasyPrivacy/EasyPrivacy.list
;      各约 39900 域名 / 各 1.4MB，追踪器列表
;  注：[]GEOSITE,category-ads-all 实测只有 909 条，远不能替代上面这些广告列表。
;
;★ subconverter ruleset 条数上限实测 ≥300，当前 275，尚有余量。
;★ 2026-09-11 瘦身：规则从 84539 条回落。扩容过头会拖慢 mihomo —— 它逐条线性匹配，
;  规则涨到 5 倍后国内域名要走完七万条才命中直连。以下十条已移除：
;    AdvertisingLite.list                           38787 条，占全部规则 46%，横亘在所有服务规则之前
;    AmazonIP.list                                  IP 段大表，Amazon.list 已覆盖域名
;    Proxy.list                                     同样含 .eu/.hk/.jp 等顶级域
;    ProxyLite.list                                 同上
;    global.txt                                     1282 条，与 []GEOSITE,geolocation-!cn 重复
;    gfw.txt                                        与 ProxyGFWlist + geolocation-!cn 重复
;    greatfire.txt                                  同上
;    tld-not-cn.txt                                 整段顶级域代理(.jp/.us/.edu/.gov…)，排在直连规则之前
;    china_ip.txt                                   3916 条，与 []GEOIP,CN 重复
;    applications.txt                               241 条 PROCESS-NAME，为此要开 find-process-mode:strict，代价大于收益
;★ 已剔除 blackmatrix7 STUN.list：其中 16 条 IP-CIDR6 是裸 IPv6 地址、无 /前缀长度，
;  mihomo 导入时报 payloadRule error 直接拒绝整份配置。上游数据问题，无法在本地修。
;  教训：加规则集后必须用 lint-rules.py 逐条校验生成产物，不能只看 YAML 能解析。

